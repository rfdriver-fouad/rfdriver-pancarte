<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RF Driver Pancarte">
<meta name="theme-color" content="#060504">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>RF Driver — Pancarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060504;
  --ink:#f2ead9;
  --muted:#8c8378;
  --hairline:rgba(216,175,110,.22);
  --hairline-strong:rgba(216,175,110,.4);
  --gold-100:#f6dfa1;
  --gold-300:#d9ae5c;
  --gold-500:#b8863a;
  --gold-ink:#0a0806;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --serif:'Cormorant Garamond',Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;min-height:100dvh}
button,input{font:inherit}

/* ---------- écran de saisie ---------- */
.setup{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(46px + env(safe-area-inset-top)) 30px calc(32px + env(safe-area-inset-bottom));
  background:radial-gradient(ellipse 90% 70% at 50% 22%,#171008 0%,#0a0806 55%,#020202 100%);
}
.header{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.logo{display:block;width:min(96px,22vw);height:auto;margin:0 auto 30px}
.brand{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(20px,4.6vw,26px);letter-spacing:.42em;
  margin:0;padding-left:.42em; /* recentre visuellement le tracking */
  background:linear-gradient(135deg,var(--gold-100) 0%,var(--gold-300) 45%,var(--gold-500) 75%,var(--gold-100) 100%);
  -webkit-background-clip:text;background-clip:text;color:var(--gold-300);
}
@supports (-webkit-background-clip:text) or (background-clip:text){.brand{-webkit-text-fill-color:transparent}}
.brand-rule{width:34px;height:1px;margin:20px auto 0;background:var(--hairline-strong)}

.gap{flex:1 1 0;min-height:24px}

.card{flex:0 0 auto;width:min(420px,100%);text-align:center}

.field{margin-bottom:26px;text-align:left}
.label{display:block;font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted);margin:0 0 12px}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;
  background:#0d0a07;border:1px solid var(--hairline);border-radius:14px}
.seg-thumb{position:absolute;top:4px;left:4px;width:calc(50% - 6px);height:50px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold-100),var(--gold-300) 55%,var(--gold-500));
  transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:1}
.seg.civ-mme .seg-thumb{transform:translateX(calc(100% + 4px))}
.seg-btn{position:relative;z-index:2;height:50px;border:0;background:transparent;
  color:var(--muted);font-weight:600;font-size:16px;border-radius:10px;
  transition:color .28s}
.seg-btn.active{color:var(--gold-ink)}

.input-wrap{border-bottom:1.5px solid var(--hairline);transition:border-color .25s}
.input-wrap:focus-within{border-color:var(--gold-300)}
input{width:100%;height:60px;border:0;background:transparent;color:var(--ink);
  padding:0 2px;font-size:24px;letter-spacing:.05em;text-transform:uppercase;outline:none}
input::placeholder{color:#4d463b}

.primary{
  width:100%;height:60px;border:0;border-radius:14px;margin-top:6px;
  background:linear-gradient(135deg,var(--gold-100) 0%,var(--gold-300) 55%,var(--gold-500) 100%);
  color:var(--gold-ink);font-weight:700;font-size:16px;letter-spacing:.03em;
  box-shadow:0 10px 26px -10px rgba(185,140,60,.5);
  transition:transform .15s ease,box-shadow .15s ease;
}
.primary:active{transform:scale(.98);box-shadow:0 6px 16px -8px rgba(185,140,60,.5)}
.hint{color:var(--muted);font-size:13px;margin-top:18px;line-height:1.5}

/* ---------- pancarte plein écran ---------- */
.sign{
  position:fixed;inset:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:calc(40px + env(safe-area-inset-top)) 28px calc(20px + env(safe-area-inset-bottom));
  background:radial-gradient(ellipse 100% 75% at 50% 38%,#140f08 0%,#070504 60%,#020202 100%);
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .5s ease,transform .5s ease;
}
.sign.show{opacity:1;transform:translateY(0);pointer-events:auto}

.sign-header{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.sign-logo{width:52px;height:auto;object-fit:contain;margin-bottom:18px}
.sign-brand{
  font-family:var(--serif);font-weight:600;
  font-size:17px;letter-spacing:.42em;padding-left:.42em;
  background:linear-gradient(135deg,var(--gold-100),var(--gold-300) 55%,var(--gold-500));
  -webkit-background-clip:text;background-clip:text;color:var(--gold-300);
}
@supports (-webkit-background-clip:text) or (background-clip:text){.sign-brand{-webkit-text-fill-color:transparent}}

.name-wrap{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.plate-rule{width:min(64vw,520px);height:1px;flex:0 0 auto;
  background:linear-gradient(90deg,transparent,var(--hairline-strong) 18%,var(--hairline-strong) 82%,transparent);
  opacity:0;transform:scaleX(.7);transition:opacity .6s ease .15s,transform .6s cubic-bezier(.2,.8,.2,1) .15s}
.sign.show .plate-rule{opacity:1;transform:scaleX(1)}

.client{
  font-family:var(--serif);font-weight:600;line-height:.95;white-space:nowrap;max-width:96vw;
  font-size:120px;letter-spacing:.01em;
  background:linear-gradient(135deg,#f6dfa1 0%,#d9ae5c 35%,#b8863a 62%,#f0d090 100%);
  -webkit-background-clip:text;background-clip:text;color:var(--gold-300);
  opacity:0;transform:scale(.96);transition:opacity .55s ease .1s,transform .55s cubic-bezier(.2,.8,.2,1) .1s;
}
@supports (-webkit-background-clip:text) or (background-clip:text){.client{-webkit-text-fill-color:transparent}}
.sign.show .client{opacity:1;transform:scale(1)}

.edit{
  position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
  height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--hairline-strong);
  background:rgba(15,12,8,.55);backdrop-filter:blur(6px);
  color:var(--gold-300);font-weight:600;font-size:14px;letter-spacing:.02em;
  transition:background .2s ease;
}
.edit:active{background:rgba(217,174,92,.12)}

@media (orientation:landscape){
  .setup{padding-top:calc(26px + env(safe-area-inset-top))}
  .logo{width:64px;margin-bottom:18px}
  .brand{font-size:18px;letter-spacing:.34em;padding-left:.34em}
  .brand-rule{margin-top:14px}
  .sign{padding-top:calc(20px + env(safe-area-inset-top))}
  .sign-logo{width:38px;margin-bottom:10px}
  .sign-brand{font-size:13px;letter-spacing:.34em;padding-left:.34em}
  .name-wrap{gap:16px}
  .plate-rule{width:min(50vw,420px)}
}
@media (prefers-reduced-motion:reduce){
  .sign,.plate-rule,.client,.primary,.seg-thumb,.seg-btn,.input-wrap{transition:none!important}
}
</style>
</head>
<body>
<main class="setup" id="setup">
  <div class="header">
    <img class="logo" src="logo-rf.png" alt="Logo RF">
    <div class="brand">RF DRIVER</div>
    <div class="brand-rule" aria-hidden="true"></div>
  </div>

  <div class="gap" aria-hidden="true"></div>

  <section class="card" aria-label="Préparer une pancarte client">
    <div class="field">
      <label class="label">Civilité</label>
      <div class="seg" id="seg" role="group" aria-label="Civilité">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button type="button" class="seg-btn active" data-civ="M.">M.</button>
        <button type="button" class="seg-btn" data-civ="Mme">Mme</button>
      </div>
    </div>

    <div class="field">
      <label class="label" for="name">Nom du client</label>
      <div class="input-wrap">
        <input id="name" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DUPONT" maxlength="40">
      </div>
    </div>

    <button class="primary" id="display" type="button">Afficher la pancarte</button>
    <div class="hint">Le nom s'adapte automatiquement à la largeur de l'écran.</div>
  </section>

  <div class="gap" aria-hidden="true"></div>
</main>

<section class="sign" id="sign" aria-live="polite">
  <div class="sign-header">
    <img class="sign-logo" src="logo-rf.png" alt="Logo RF">
    <div class="sign-brand">RF DRIVER</div>
  </div>
  <div class="name-wrap" id="nameWrap">
    <span class="plate-rule" aria-hidden="true"></span>
    <div class="client" id="client">M. DUPONT</div>
    <span class="plate-rule" aria-hidden="true"></span>
  </div>
  <button class="edit" id="edit" type="button">Changer le client</button>
</section>

<script>
(()=>{
let civ='M.';
const input=document.getElementById('name'),
      sign=document.getElementById('sign'),
      client=document.getElementById('client'),
      wrap=document.getElementById('nameWrap'),
      seg=document.getElementById('seg');

const buttons=[...document.querySelectorAll('[data-civ]')];
buttons.forEach(b=>b.addEventListener('click',()=>{
  civ=b.dataset.civ;
  buttons.forEach(x=>x.classList.toggle('active',x===b));
  seg.classList.toggle('civ-mme',civ==='Mme');
  input.focus();
}));

function fit(){
  let size=Math.min(150,Math.max(72,window.innerWidth*.16));
  client.style.fontSize=size+'px';
  const maxW=wrap.clientWidth*.94,maxH=wrap.clientHeight*.6;
  while(size>34&&(client.scrollWidth>maxW||client.scrollHeight>maxH)){
    size-=2;client.style.fontSize=size+'px';
  }
}

function show(){
  const n=input.value.trim().replace(/\s+/g,' ');
  if(!n){input.focus();return}
  client.textContent=civ+' '+n.toLocaleUpperCase('fr-FR');
  sign.classList.add('show');
  requestAnimationFrame(fit);
}

document.getElementById('display').addEventListener('click',show);
input.addEventListener('keydown',e=>{if(e.key==='Enter')show()});
document.getElementById('edit').addEventListener('click',()=>{
  sign.classList.remove('show');
  input.select();
});
window.addEventListener('resize',()=>{if(sign.classList.contains('show'))requestAnimationFrame(fit)});
})();
</script>
</body>
</html>
