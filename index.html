<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RF Driver">
<meta name="theme-color" content="#000000">
<title>RF Driver — Pancarte</title>
<style>
:root{--black:#000;--white:#fff;--gold:#d4af37;--muted:#a7a7a7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
button,input{font:inherit}
.setup{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));background:#000}
.card{width:min(720px,100%);text-align:center}
.logo{display:block;width:min(240px,42vw);height:auto;margin:0 auto 8px}
.brand{font-family:Georgia,"Times New Roman",serif;color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:clamp(28px,4vw,42px);white-space:nowrap;margin:0 0 34px}
.label{display:block;text-align:left;font-weight:650;font-size:18px;margin:0 0 10px;color:#eee}
.civility{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.civility button{height:58px;border-radius:14px;border:1px solid #555;background:#111;color:#fff;font-weight:750;font-size:20px}
.civility button.active{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
input{width:100%;height:66px;border-radius:14px;border:1px solid #555;background:#111;color:#fff;padding:0 18px;font-size:24px;text-transform:uppercase;outline:none;margin-bottom:18px}
input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.22)}
.primary{width:100%;height:64px;border:0;border-radius:14px;background:var(--gold);color:#000;font-weight:850;font-size:20px}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.sign{display:none;position:fixed;inset:0;background:#000;color:#fff;overflow:hidden;padding:calc(18px + env(safe-area-inset-top)) 26px calc(18px + env(safe-area-inset-bottom));align-items:center;justify-content:center;flex-direction:column;text-align:center}
.sign.show{display:flex}
.sign-logo{width:min(250px,30vw);height:auto;object-fit:contain;flex:0 0 auto}
.sign-brand{font-family:Georgia,"Times New Roman",serif;color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:clamp(27px,3.6vw,46px);white-space:nowrap;margin-top:0}
.name-wrap{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px 0}
.client{font-weight:850;line-height:.92;white-space:nowrap;max-width:96vw;font-size:120px;letter-spacing:.01em}
.edit{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));height:50px;padding:0 20px;border-radius:25px;border:1px solid #444;background:rgba(18,18,18,.9);color:#ddd;font-weight:700;font-size:16px}
@media (orientation:landscape){.sign-logo{width:min(180px,18vw)}.sign-brand{font-size:30px}.name-wrap{padding:10px 0}}
</style>
</head>
<body>
<main class="setup" id="setup">
  <section class="card" aria-label="Préparer une pancarte client">
    <img class="logo" src="logo-rf.png" alt="Logo RF">
    <div class="brand">RF DRIVER</div>
    <label class="label">Civilité</label>
    <div class="civility" role="group" aria-label="Civilité">
      <button type="button" class="active" data-civ="M.">M.</button>
      <button type="button" data-civ="MME">Mme</button>
    </div>
    <label class="label" for="name">Nom du client</label>
    <input id="name" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DUPONT" maxlength="40">
    <button class="primary" id="display" type="button">AFFICHER LA PANCARTE</button>
    <div class="hint">Le nom s'adapte automatiquement à la largeur de l'écran.</div>
  </section>
</main>
<section class="sign" id="sign" aria-live="polite">
  <img class="sign-logo" src="logo-rf.png" alt="Logo RF">
  <div class="sign-brand">RF DRIVER</div>
  <div class="name-wrap" id="nameWrap"><div class="client" id="client">M. DUPONT</div></div>
  <button class="edit" id="edit" type="button">Changer le client</button>
</section>
<script>
(()=>{
let civ='M.';
const input=document.getElementById('name');
const sign=document.getElementById('sign');
const client=document.getElementById('client');
const wrap=document.getElementById('nameWrap');
const buttons=[...document.querySelectorAll('[data-civ]')];
buttons.forEach(b=>b.addEventListener('click',()=>{civ=b.dataset.civ;buttons.forEach(x=>x.classList.toggle('active',x===b));input.focus()}));
function fit(){
  let size=Math.min(150,Math.max(72,window.innerWidth*.16));
  client.style.fontSize=size+'px';
  const maxW=wrap.clientWidth*.96, maxH=wrap.clientHeight*.82;
  while(size>34 && (client.scrollWidth>maxW || client.scrollHeight>maxH)){size-=2;client.style.fontSize=size+'px'}
}
function show(){
 const n=input.value.trim().replace(/\s+/g,' ');
 if(!n){input.focus();return}
 client.textContent=civ+' '+n.toLocaleUpperCase('fr-FR');
 sign.classList.add('show');
 requestAnimationFrame(fit);
}
document.getElementById('display').addEventListener('click',show);
input.addEventListener('keydown',e=>{if(e.key==='Enter')show()});
document.getElementById('edit').addEventListener('click',()=>{sign.classList.remove('show');input.select()});
window.addEventListener('resize',()=>{if(sign.classList.contains('show'))requestAnimationFrame(fit)});
})();
</script>
</body>
</html>
